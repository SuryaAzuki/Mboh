name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Init Capacitor Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "APEX GP LAN MotoGP" "com.apexgp.lanmotogp" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Set Landscape & Cleartext LAN Permission
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            xml = xml.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"");
            fs.writeFileSync(p, xml);
          '

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-gp-lan-motogp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
