name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Init Capacitor Android
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "APEX GP LAN MotoGP" "com.apexgp.lanmotogp" --web-dir dist || true
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.apexgp.lanmotogp",
            "appName": "APEX GP LAN MotoGP",
            "webDir": "dist",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#0b0f17"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set Landscape & Cleartext LAN Permission
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            xml = xml.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"");
            fs.writeFileSync(p, xml);
          '

      - name: Apex GP APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-gp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
